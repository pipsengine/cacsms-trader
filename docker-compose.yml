services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_cacsms-trader}
      POSTGRES_USER: ${POSTGRES_USER:-cacsms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Adm1n.c0m}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cacsms} -d ${POSTGRES_DB:-db_cacsms-trader}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    volumes:
      - type: bind
        source: ${CACSMS_MT5_METAQUOTES_HOST_PATH:-./.docker/mt5-host-stub}
        target: /mt5-host/MetaQuotes
        bind:
          create_host_path: false
    ports:
      - "${APP_HOST_PORT:-3001}:3000"
      - "${MT5_BRIDGE_HOST_PORT:-8787}:8787"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3001}
      CACSMS_ENV: ${CACSMS_ENV:-development}
      CACSMS_TIMEZONE: ${CACSMS_TIMEZONE:-Africa/Lagos}
      NEXT_PUBLIC_TRADING_MODE: ${NEXT_PUBLIC_TRADING_MODE:-demo}
      NEXT_PUBLIC_MT5_BRIDGE_URL: ${NEXT_PUBLIC_MT5_BRIDGE_URL:-http://localhost:8787}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-db_cacsms-trader}
      POSTGRES_USER: ${POSTGRES_USER:-cacsms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Adm1n.c0m}
      REDIS_URL: redis://redis:6379
      MT5_BRIDGE_SHARED_SECRET: ${MT5_BRIDGE_SHARED_SECRET:-mt5_cacsms}
      MT5_BRIDGE_PORT: ${MT5_BRIDGE_PORT:-8787}
      MT5_HEARTBEAT_TIMEOUT_MS: ${MT5_HEARTBEAT_TIMEOUT_MS:-15000}
      CACSMS_ENABLE_EXECUTION: ${CACSMS_ENABLE_EXECUTION:-true}
      CACSMS_ENABLE_AUTONOMY_EXECUTION: ${CACSMS_ENABLE_AUTONOMY_EXECUTION:-true}
      CACSMS_PIPELINE_DEMO_MODE: ${CACSMS_PIPELINE_DEMO_MODE:-true}
      CACSMS_PIPELINE_SESSIONS_PER_CYCLE: ${CACSMS_PIPELINE_SESSIONS_PER_CYCLE:-3}
      CACSMS_CAPTURE_COVERAGE_MAX_AGE_HOURS: ${CACSMS_CAPTURE_COVERAGE_MAX_AGE_HOURS:-4}
      CACSMS_CAPTURE_RETENTION_HOURS: ${CACSMS_CAPTURE_RETENTION_HOURS:-4}
      CACSMS_MIN_OPEN_POSITIONS: ${CACSMS_MIN_OPEN_POSITIONS:-0}
      CACSMS_MAX_ENTRIES_PER_CYCLE: ${CACSMS_MAX_ENTRIES_PER_CYCLE:-1}
      RISK_SYMBOL_BASED_TRADE_LIMIT: ${RISK_SYMBOL_BASED_TRADE_LIMIT:-false}
      CACSMS_CONTINUOUS_DISPATCH_COOLDOWN_MINUTES: ${CACSMS_CONTINUOUS_DISPATCH_COOLDOWN_MINUTES:-3}
      CACSMS_CONTINUOUS_REFILL_CONFIDENCE: ${CACSMS_CONTINUOUS_REFILL_CONFIDENCE:-35}
      CACSMS_CONTINUOUS_REFILL_READINESS: ${CACSMS_CONTINUOUS_REFILL_READINESS:-30}
      CACSMS_PAIR_SELECTION_MAX_SPREAD_POINTS: ${CACSMS_PAIR_SELECTION_MAX_SPREAD_POINTS:-120}
      CACSMS_GOLD_ONLY_TRADING: ${CACSMS_GOLD_ONLY_TRADING:-true}
      CACSMS_GOLD_SERIAL_TRADING: ${CACSMS_GOLD_SERIAL_TRADING:-false}
      CACSMS_GOLD_MAX_CONCURRENT_POSITIONS: ${CACSMS_GOLD_MAX_CONCURRENT_POSITIONS:-5}
      CACSMS_GOLD_MAX_ENTRIES_PER_CYCLE: ${CACSMS_GOLD_MAX_ENTRIES_PER_CYCLE:-1}
      CACSMS_GOLD_ENTRY_LEGS: ${CACSMS_GOLD_ENTRY_LEGS:-5}
      CACSMS_GOLD_BATCH_ENTRY: ${CACSMS_GOLD_BATCH_ENTRY:-true}
      CACSMS_GOLD_BATCH_LOT_MODE: ${CACSMS_GOLD_BATCH_LOT_MODE:-replicate}
      CACSMS_GOLD_LEG_LOTS: ${CACSMS_GOLD_LEG_LOTS:-0.01}
      CACSMS_GOLD_MIN_INSTITUTIONAL_QUALITY: ${CACSMS_GOLD_MIN_INSTITUTIONAL_QUALITY:-62}
      CACSMS_GOLD_MAX_SETUP_EXPOSURE: ${CACSMS_GOLD_MAX_SETUP_EXPOSURE:-5}
      CACSMS_GOLD_STACK_MIN_CONFIDENCE: ${CACSMS_GOLD_STACK_MIN_CONFIDENCE:-68}
      CACSMS_GOLD_STACK_MIN_READINESS: ${CACSMS_GOLD_STACK_MIN_READINESS:-62}
      CACSMS_GOLD_MAX_SPREAD_POINTS: ${CACSMS_GOLD_MAX_SPREAD_POINTS:-120}
      CACSMS_GOLD_MIN_REWARD_RISK: ${CACSMS_GOLD_MIN_REWARD_RISK:-2}
      CACSMS_GOLD_TARGET_REWARD_RISK: ${CACSMS_GOLD_TARGET_REWARD_RISK:-3}
      CACSMS_GOLD_INSTITUTIONAL_TARGET_REWARD_RISK: ${CACSMS_GOLD_INSTITUTIONAL_TARGET_REWARD_RISK:-4}
      CACSMS_GOLD_MAX_TARGET_REWARD_RISK: ${CACSMS_GOLD_MAX_TARGET_REWARD_RISK:-6}
      CACSMS_STRATEGY_BOOK_OVERRIDE_VISUAL_SCORE: ${CACSMS_STRATEGY_BOOK_OVERRIDE_VISUAL_SCORE:-68}
      CACSMS_GOLD_MAX_TRADES_PER_DAY: ${CACSMS_GOLD_MAX_TRADES_PER_DAY:-25}
      CACSMS_GOLD_STANDARD_BE_R: ${CACSMS_GOLD_STANDARD_BE_R:-0.85}
      CACSMS_GOLD_BE_SPREAD_BUFFER: ${CACSMS_GOLD_BE_SPREAD_BUFFER:-3}
      CACSMS_GOLD_BE_SLIPPAGE_BUFFER: ${CACSMS_GOLD_BE_SLIPPAGE_BUFFER:-2}
      CACSMS_GOLD_ENABLED_STYLES: ${CACSMS_GOLD_ENABLED_STYLES:-scalp,intraday,day_trade,swing}
      CACSMS_REATTACH_TOPDOWN_ENABLED: ${CACSMS_REATTACH_TOPDOWN_ENABLED:-true}
      CACSMS_REATTACH_TOPDOWN_SYMBOLS: ${CACSMS_REATTACH_TOPDOWN_SYMBOLS:-XAUUSD}
      CACSMS_INTERNAL_APP_URL: ${CACSMS_INTERNAL_APP_URL:-http://127.0.0.1:3000}
      RISK_MAX_OPEN_POSITIONS_PER_SYMBOL: ${RISK_MAX_OPEN_POSITIONS_PER_SYMBOL:-5}
      CACSMS_SAFETY_MAX_OPEN_PER_SYMBOL: ${CACSMS_SAFETY_MAX_OPEN_PER_SYMBOL:-5}
      CACSMS_24H_TRADING_ENABLED: ${CACSMS_24H_TRADING_ENABLED:-true}
      CACSMS_ALLOW_TRADING_DURING_NEWS: ${CACSMS_ALLOW_TRADING_DURING_NEWS:-true}
      CACSMS_ENABLED_TRADING_STYLES: ${CACSMS_ENABLED_TRADING_STYLES:-scalp,intraday,day_trade,swing,position}
      CACSMS_SCALP_RISK_PERCENT: ${CACSMS_SCALP_RISK_PERCENT:-0.2}
      CACSMS_INTRADAY_RISK_PERCENT: ${CACSMS_INTRADAY_RISK_PERCENT:-0.35}
      CACSMS_DAY_TRADE_RISK_PERCENT: ${CACSMS_DAY_TRADE_RISK_PERCENT:-0.45}
      CACSMS_SWING_RISK_PERCENT: ${CACSMS_SWING_RISK_PERCENT:-0.5}
      CACSMS_POSITION_RISK_PERCENT: ${CACSMS_POSITION_RISK_PERCENT:-0.35}
      RISK_CONTINUOUS_TRADING_ENABLED: ${RISK_CONTINUOUS_TRADING_ENABLED:-true}
      CACSMS_DEMO_CONFIDENCE_THRESHOLD: ${CACSMS_DEMO_CONFIDENCE_THRESHOLD:-42}
      CACSMS_DEMO_DECISION_CONFIDENCE_THRESHOLD: ${CACSMS_DEMO_DECISION_CONFIDENCE_THRESHOLD:-42}
      CACSMS_DEMO_DECISION_READINESS_THRESHOLD: ${CACSMS_DEMO_DECISION_READINESS_THRESHOLD:-42}
      CACSMS_DEMO_VISUAL_READINESS_THRESHOLD: ${CACSMS_DEMO_VISUAL_READINESS_THRESHOLD:-48}
      CACSMS_ENABLE_LIVE_EXECUTION: ${CACSMS_ENABLE_LIVE_EXECUTION:-false}
      CACSMS_LARGE_EQUITY_THRESHOLD: ${CACSMS_LARGE_EQUITY_THRESHOLD:-100000}
      CACSMS_PROP_RISK_PER_TRADE_PERCENT: ${CACSMS_PROP_RISK_PER_TRADE_PERCENT:-0.35}
      CACSMS_LIVE_RISK_PER_TRADE_PERCENT: ${CACSMS_LIVE_RISK_PER_TRADE_PERCENT:-0.25}
      CACSMS_LARGE_EQUITY_RISK_PER_TRADE_PERCENT: ${CACSMS_LARGE_EQUITY_RISK_PER_TRADE_PERCENT:-0.15}
      CACSMS_DEMO_SIGNAL_COOLDOWN_MINUTES: ${CACSMS_DEMO_SIGNAL_COOLDOWN_MINUTES:-15}
      CACSMS_DEMO_DISPATCH_COOLDOWN_MINUTES: ${CACSMS_DEMO_DISPATCH_COOLDOWN_MINUTES:-30}
      CACSMS_AUTO_TEST_HEARTBEAT_FRESH_MS: ${CACSMS_AUTO_TEST_HEARTBEAT_FRESH_MS:-5000}
      CACSMS_AUTO_TEST_DELAY_SECONDS: ${CACSMS_AUTO_TEST_DELAY_SECONDS:-30}
      CACSMS_AUTO_TEST_MAX_SPREAD_POINTS: ${CACSMS_AUTO_TEST_MAX_SPREAD_POINTS:-100}
      RISK_DAILY_DRAWDOWN_PERCENT: ${RISK_DAILY_DRAWDOWN_PERCENT:-4}
      RISK_MAX_DRAWDOWN_PERCENT: ${RISK_MAX_DRAWDOWN_PERCENT:-8}
      RISK_PER_TRADE_PERCENT: ${RISK_PER_TRADE_PERCENT:-0.5}
      RISK_DAILY_TRADE_LIMIT_ENABLED: ${RISK_DAILY_TRADE_LIMIT_ENABLED:-false}
      RISK_MAX_TRADES_PER_DAY: ${RISK_MAX_TRADES_PER_DAY:-5}
      RISK_MAX_OPEN_TRADES: ${RISK_MAX_OPEN_TRADES:-3}
      RISK_MAX_LOT_SIZE: ${RISK_MAX_LOT_SIZE:-1}
      RISK_MIN_REWARD_RISK_RATIO: ${RISK_MIN_REWARD_RISK_RATIO:-2}
      RISK_STOP_AFTER_CONSECUTIVE_LOSSES: ${RISK_STOP_AFTER_CONSECUTIVE_LOSSES:-2}
      CACSMS_KILL_SWITCH: ${CACSMS_KILL_SWITCH:-false}
      CACSMS_NEWS_BLACKOUT: ${CACSMS_NEWS_BLACKOUT:-false}
      CACSMS_ENABLE_EA_DEPLOYMENT_TOOL: ${CACSMS_ENABLE_EA_DEPLOYMENT_TOOL:-true}
      CACSMS_EA_DEPLOYMENT_ALLOW_REMOTE: ${CACSMS_EA_DEPLOYMENT_ALLOW_REMOTE:-false}
      CACSMS_MT5_METAQUOTES_ROOT: /mt5-host/MetaQuotes
      CACSMS_MT5_TERMINAL_ROOT: /mt5-host/MetaQuotes/Terminal
      CACSMS_EA_PROJECT_FOLDER: /app/mt5/experts/CacsmsTraderEA
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
